<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$NEO Admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:60px 5vw}.admin{max-width:1000px;margin:auto}.admin h1{font-size:56px}.panel{border:1px solid var(--line);padding:28px;background:#070a0b;margin:20px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;font:10px 'DM Mono';color:#7e8b8f}.field input{background:#050708;border:1px solid #273236;color:#dce5e3;padding:14px;font:12px 'DM Mono'}.wide{grid-column:1/-1}.row{display:grid;grid-template-columns:1fr 1.4fr .7fr 1fr 1.5fr auto;gap:8px;margin:8px 0}.row input{min-width:0;background:#050708;border:1px solid #273236;color:#dce5e3;padding:10px;font:10px 'DM Mono'}.save,.add,.del{background:#edf3f1;color:#050708;border:0;padding:13px 18px;font:10px 'DM Mono';cursor:pointer}.del{background:#161b1d;color:#9aa5a8}.status{font:10px 'DM Mono';margin-left:12px}.top{display:flex;justify-content:space-between;align-items:center}@media(max-width:800px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.row{grid-template-columns:1fr}.top{display:block}}</style></head><body><main class="admin"><div class="top"><div><span class="kicker">PRIVATE CONTROL PANEL</span><h1>$NEO ADMIN</h1></div><a class="secondary" href="/">← SITE</a></div><div class="panel"><div class="fields"><label class="field wide">ADMIN KEY<input id="key" type="password" autocomplete="current-password" placeholder="Server ADMIN_KEY"></label><label class="field wide">CONTRACT ADDRESS<input id="contract"></label><label class="field wide">BUY / TRADING URL<input id="buy"></label><label class="field">DEFENSE %<input id="defense" type="number" min="0" max="100"></label><label class="field">FUND GOAL ($)<input id="goal" type="number" min="1"></label><label class="field wide">DEFAULT RECIPIENT / NOTE<input id="recipient"></label></div></div><div class="panel"><div class="top"><div><span class="kicker">VERIFIED CONTRIBUTIONS</span><h2>LEDGER</h2></div><button class="add" id="add">+ ADD ENTRY</button></div><div id="rows"></div></div><button class="save" id="save">SAVE & PUBLISH</button><span class="status" id="status"></span></main><script>
let cfg;const $=s=>document.querySelector(s);async function init(){cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());$('#contract').value=cfg.contractAddress||'';$('#buy').value=cfg.buyUrl||'';$('#defense').value=cfg.defensePercent||80;$('#goal').value=cfg.goal||100000;$('#recipient').value=cfg.recipient||'';render()}function render(){let box=$('#rows');box.innerHTML='';(cfg.contributions||[]).forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<input type="date" value="${x.date||''}" data-k="date"><input placeholder="Recipient" value="${x.recipient||''}" data-k="recipient"><input type="number" placeholder="Amount" value="${x.amount||''}" data-k="amount"><input placeholder="NEO-001" value="${x.ref||''}" data-k="ref"><input placeholder="Proof URL" value="${x.proof||''}" data-k="proof"><button class="del">×</button>`;r.querySelectorAll('input').forEach(el=>el.oninput=()=>{cfg.contributions[i][el.dataset.k]=el.dataset.k==='amount'?+el.value:el.value});r.querySelector('.del').onclick=()=>{cfg.contributions.splice(i,1);render()};box.appendChild(r)})}$('#add').onclick=()=>{cfg.contributions.push({date:new Date().toISOString().slice(0,10),recipient:cfg.recipient||'',amount:0,ref:'',proof:''});render()};$('#save').onclick=async()=>{cfg.contractAddress=$('#contract').value.trim()||'TBA';cfg.buyUrl=$('#buy').value.trim();cfg.defensePercent=+$('#defense').value;cfg.operationsPercent=100-cfg.defensePercent;cfg.goal=+$('#goal').value;cfg.recipient=$('#recipient').value.trim();let st=$('#status');st.textContent='SAVING…';let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('#key').value},body:JSON.stringify(cfg)}),j=await r.json();st.textContent=r.ok?'PUBLISHED ✓':(j.error||'ERROR')};init();</script></body></html>
